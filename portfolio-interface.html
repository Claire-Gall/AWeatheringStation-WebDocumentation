<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Weathering Station: Autographic Comprehension of a Fog Layer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f7f4;
  --ink: #1c1c1a;
  --line: #000000;
  --dot: #1c1c1a;
  --panel-bg: #ffffff;
  --accent: #53514f;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 300;
  overflow: hidden;
}

.stage {
  position: relative;
  width: 100%; height: 100vh;
  display: flex;
  align-items: center;
}

.spine {
  position: absolute;
  left: 72px;
  top: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 20;
}

.item {
  position: relative;
  display: flex;
  align-items: center;
  height: 60px;
  cursor: pointer;
  width: 320px;
}

.item-line {
  position: absolute;
  left: 0;
  height: 1px;
  background: var(--line);
  width: 100px;
  transition: width 0.45s cubic-bezier(0.77,0,0.18,1), background 0.2s;
}

.item-dot {
  position: absolute;
  left: 100px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--bg);
  border: 1.5px solid var(--line);
  transform: translate(-50%, -50%);
  transition: left 0.45s cubic-bezier(0.77,0,0.18,1), background 0.25s, border-color 0.25s;
  z-index: 2;
}

.item-label {
  position: absolute;
  left: 118px;
  font-family: 'EB Garamond', serif;
  font-size: 14px;
  letter-spacing: 0.07em;
  color: var(--ink);
  opacity: 0.4;
  white-space: nowrap;
  transition: opacity 0.25s;
  pointer-events: none;
}

.item:hover .item-line,
.item.open .item-line {
  width: 180px;
  background: var(--ink);
}

.item:hover .item-dot,
.item.open .item-dot {
  left: 180px;
  background: var(--dot);
  border-color: var(--dot);
}

.item:hover .item-label,
.item.open .item-label {
  opacity: 1;
}

.connector {
  position: absolute;
  left: 180px;
  height: 1px;
  background: var(--ink);
  width: 0;
  top: 50%;
  transform: translateY(-50%);
  transition: width 0.38s cubic-bezier(0.77,0,0.18,1) 0.08s;
  z-index: 5;
  pointer-events: none;
}

.item.open .connector {
  width: 68px;
}

/* PANEL */
.panel {
  position: absolute;
  left: 320px;
  width: calc(100vw - 360px);
  max-height: 76vh;
  background: var(--panel-bg);
  border: 1px solid #e2ddd5;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-50%) scaleX(0);
  transform-origin: left center;
  transition: transform 0.52s cubic-bezier(0.77,0,0.18,1), opacity 0.3s ease;
  z-index: 10;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}

.panel.visible {
  transform: translateY(-50%) scaleX(1);
  opacity: 1;
  pointer-events: all;
}

.panel-inner {
  display: flex;
  height: 100%;
  min-height: 340px;
}

.panel-image {
  width: 42%;
  flex-shrink: 0;
  background: #e2ddd5;
  position: relative;
  overflow: hidden;
  min-height: 340px;
}

.panel-image-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #d62b2b;
  font-family: 'EB Garamond', serif;
}

.panel-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.panel-text {
  flex: 1;
  padding: 44px 40px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.panel-category {
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
}

.panel-title {
  font-family: 'EB Garamond', serif;
  font-size: 28px;
  font-weight: 400;
  line-height: 1.15;
  color: var(--ink);
}

.panel-body {
  font-size: 13.5px;
  line-height: 1.85;
  color: #dc1212;
  font-weight: 300;
  max-width: 400px;
}

.panel-meta {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: #b0aba2;
  margin-top: 6px;
}

.panel-close {
  position: absolute;
  top: 18px; right: 20px;
  width: 22px; height: 22px;
  cursor: pointer;
  background: none;
  border: none;
  opacity: 0.25;
  transition: opacity 0.2s;
  z-index: 20;
}
.panel-close:hover { opacity: 0.7; }
.panel-close::before,
.panel-close::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 14px; height: 1px;
  background: var(--ink);
}
.panel-close::before { transform: translate(-50%,-50%) rotate(45deg); }
.panel-close::after  { transform: translate(-50%,-50%) rotate(-45deg); }

.site-name {
  position: absolute;
  top: 36px; left: 72px;
  font-family: 'EB Garamond', serif;
  font-size: 13px;
  letter-spacing: 0.14em;
  color: var(--ink);
  opacity: 0.4;
}

.site-year {
  position: absolute;
  bottom: 30px; right: 40px;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: #ccc;
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <span class="site-name">Portfolio</span>
  <span class="site-year">2026</span>

  <nav class="spine" id="spine"></nav>

  <div class="panel" id="panel">
    <button class="panel-close" id="panelClose"></button>
    <div class="panel-inner">
      <div class="panel-image" id="panelImage">
        <div class="panel-image-label" id="panelImageLabel">Image</div>
        <img id="panelImg" src="" alt="" style="display:none; position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
      </div>
      <div class="panel-text">
        <span class="panel-category" id="panelCategory"></span>
        <h2 class="panel-title" id="panelTitle"></h2>
        <p class="panel-body" id="panelBody"></p>
        <p class="panel-meta" id="panelMeta"></p>
      </div>
    </div>
  </div>
</div>

<script>
const items = [
  {
    label: "Work",
    category: "Selected Projects",
    title: "Recent Work",
    body: "A curated selection of projects spanning visual identity, editorial design, and digital experiences. Each piece begins with a question and ends with a form.",
    meta: "2022 — 2026",
    bg: "#dedad2"
  },
  {
    label: "Experiments",
    category: "Process",
    title: "Autographic Visualization",
    body: "A sequence of experiments with materially transcoding atmospheric data. This work contends with different aesthetics of data collection.",
    meta: "Est. 2019",
    bg: "#d2d9d2"
  },
  {
    label: "Writing",
    category: "Essays & Notes",
    title: "On Making",
    body: "Occasional essays on design process, visual culture, and the slow accumulation of aesthetic decisions that define a body of work.",
    meta: "Ongoing",
    bg: "#d9d2d2"
  },
  {
    label: "Archive",
    category: "2015 — 2021",
    title: "Earlier Work",
    body: "A record of earlier projects — some finished, some abandoned, all instructive. The archive as a form of ongoing conversation with the past.",
    meta: "60 projects",
    bg: "#d4d3ce"
  },
  {
    label: "Contact",
    category: "Get in touch",
    title: "Let's Talk",
    body: "Available for commissions, collaborations, and conversations. Response time: usually within a day or two.",
    meta: "hello@portfolio.com",
    bg: "#d2d3d9"
  }
];

const spine = document.getElementById('spine');
const panel = document.getElementById('panel');
const panelClose = document.getElementById('panelClose');
let openItem = null;

items.forEach((data) => {
  const item = document.createElement('div');
  item.className = 'item';
  item.innerHTML = `
    <div class="item-line"></div>
    <div class="item-dot"></div>
    <div class="connector"></div>
    <span class="item-label">${data.label}</span>
  `;

  item.addEventListener('mouseenter', () => {
    if (openItem !== item) openPanel(item, data);
  });

  spine.appendChild(item);
});

function openPanel(itemEl, data) {
  if (openItem) openItem.classList.remove('open');
  openItem = itemEl;
  itemEl.classList.add('open');

  const stageRect = document.getElementById('stage').getBoundingClientRect();
  const itemRect = itemEl.getBoundingClientRect();
  const relTop = itemRect.top - stageRect.top + itemRect.height / 2;

  panel.classList.remove('visible');
  panel.style.top = relTop + 'px';

  document.getElementById('panelCategory').textContent = data.category;
  document.getElementById('panelTitle').textContent = data.title;
  document.getElementById('panelBody').textContent = data.body;
  document.getElementById('panelMeta').textContent = data.meta;
  document.getElementById('panelImage').style.background = data.bg;
  document.getElementById('panelImg').style.display = 'none';
  document.getElementById('panelImageLabel').style.display = 'flex';

  requestAnimationFrame(() => requestAnimationFrame(() => {
    panel.classList.add('visible');
  }));
}

function closePanel() {
  panel.classList.remove('visible');
  if (openItem) { openItem.classList.remove('open'); openItem = null; }
}

panelClose.addEventListener('click', closePanel);
document.getElementById('stage').addEventListener('click', e => {
  if (!panel.contains(e.target) && !e.target.closest('.item')) closePanel();
});
</script>
</body>
</html>
